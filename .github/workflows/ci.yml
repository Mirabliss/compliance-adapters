name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-unit:
    name: Lint & Unit Tests (TypeScript)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (all packages)
        # Runs ESLint across sep10-auth/src, sanctions-oracle/src, and horizon-listener/src
        run: npm run lint

      - name: Format check
        # Verifies all .ts/.js files across every package match Prettier rules.
        # Fails the build if any file would be reformatted.
        run: npm run format:check

      - name: Check License Headers
        run: npm run check:license

      - name: Check Root Changelog
        run: npm run check:changelog

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit Tests
        run: npm test -- --coverage

      - name: CLI Wrapper Integration Tests
        # Spawns bin/compliance-adapters.js as a child process end-to-end
        # (issue #345). Needs the sanctions-oracle build produced above.
        run: npm run test:cli

      - name: Report Coverage
        if: always()
        run: node scripts/report-coverage.js

      - name: Upload Coverage Artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: code-coverage-report
          path: |
            */coverage/
            examples/*/coverage/

      - name: Audit dependencies
        run: npm audit --audit-level=high

  test-sdk-compatibility:
    name: SDK Compatibility Tests (Stellar SDK ${{ matrix.stellar-sdk-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x]
        # Test every supported minor release in the current SDK major line.
        stellar-sdk-version: ['16.0.1', '16.1.0', '16.2.0']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Stellar SDK ${{ matrix.stellar-sdk-version }}
        run: npm install --no-save --package-lock=false @stellar/stellar-sdk@${{ matrix.stellar-sdk-version }}

      - name: Verify Stellar SDK version
        run: npm ls @stellar/stellar-sdk

      - name: Build packages
        run: npm run build

      - name: Run end-to-end compatibility tests
        run: npm run test:compatibility --workspace=e2e-tests

  benchmark:
    name: Performance Benchmark (sep10-auth)
    runs-on: ubuntu-latest
    needs: test-unit
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run SEP-10 Challenge Throughput Benchmark
        id: benchmark
        run: |
          npm run --silent bench --workspace=sep10-auth | tee benchmark.log

      - name: Evaluate benchmark regression threshold
        id: benchmark-regression
        run: |
          node scripts/validate-benchmark.js \
            --log-file benchmark.log \
            --baseline-file sep10-auth/bench/challenge-throughput-baseline.json \
            --threshold-percent 20 \
            --summary-file benchmark-summary.md

      - name: Run HorizonListener Webhook Throughput Benchmark
        id: benchmark-listener
        run: |
          npm run --silent bench --workspace=horizon-listener | tee listener-benchmark.log

      - name: Evaluate listener benchmark regression threshold
        id: benchmark-listener-regression
        run: |
          node scripts/validate-benchmark.js \
            --log-file listener-benchmark.log \
            --baseline-file horizon-listener/bench/listener-throughput-baseline.json \
            --threshold-percent 20 \
            --summary-file listener-benchmark-summary.md

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-${{ matrix.node-version }}
          path: |
            benchmark.log
            benchmark-summary.md
            listener-benchmark.log
            listener-benchmark-summary.md

      - name: Comment benchmark results to job summary
        if: always()
        run: |
          if [ -f benchmark-summary.md ]; then
            cat benchmark-summary.md >> $GITHUB_STEP_SUMMARY
          else
            echo "## SEP-10 Challenge Throughput Benchmark" >> $GITHUB_STEP_SUMMARY
            echo ":x: Benchmark summary was not generated. Check benchmark logs." >> $GITHUB_STEP_SUMMARY
          fi

  test-e2e:
    name: End-to-End Integration Tests
    runs-on: ubuntu-latest
    needs: [test-unit]
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Run E2E Tests
        run: npm run test:e2e:ci
        env:
          # Pass contract ID if pre-deployed; otherwise tests will use placeholder
          TEST_CONTRACT_ID: ${{ secrets.TEST_CONTRACT_ID }}

  test-integration-horizon-listener:
    name: Horizon-Listener Integration Test (real Soroban testnet)
    runs-on: ubuntu-latest
    needs: [test-unit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Run Horizon-Listener integration test
        run: npm run test:integration:horizon-listener:ci
        env:
          # Pass contract ID if pre-deployed; otherwise tests will deploy fresh
          TEST_CONTRACT_ID: ${{ secrets.TEST_CONTRACT_ID }}

  # No Rust/Soroban adapter contracts exist in this repo yet. If one is added
  # under a package with a Cargo.toml, add a matching `cargo test` job here.

  docker-build:
    name: Build Docker image (issue #867)
    runs-on: ubuntu-latest
    needs: test-unit
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: compliance-adapters:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test --help (non-root user)
        # Verify the entrypoint works and the process runs as a non-root user
        run: |
          docker run --rm compliance-adapters:ci --help
          USER_ID=$(docker run --rm --entrypoint id compliance-adapters:ci -u)
          if [ "$USER_ID" = "0" ]; then
            echo "ERROR: container is running as root (uid 0)" >&2
            exit 1
          fi
          echo "Container runs as uid $USER_ID (non-root) ✓"
